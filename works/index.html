<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Works</title>

    <!-- CSS（相対パスで安全に読み込み） -->
    <link rel="stylesheet" href="../style-new.css" />
    <link rel="icon" href="../favicon.png" type="image/png" />
  </head>

  <body>
    <!-- Hero Section -->
    <section class="works-hero">
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <h1 class="hero-name">Works</h1>
        <p class="hero-title">Noriko Togashi - Web Creator</p>
      </div>
    </section>

    <!-- Intro Section -->
    <section id="works-intro" class="works-intro">
      <div class="intro-inner">
        <h2 class="intro-heading">制作実績</h2>
      </div>
    </section>

    <!-- Gallery Section -->
    <section id="works-gallery" class="works-gallery">
      <div class="intro-inner">
        <div class="works-grid">

          <!-- 作品カード1（ポートフォリオサイト） -->
          <div class="work-item">
            <div class="work-card">
              <a
                href="https://norikot622622-hub.github.io/noriko.t-portfolio/"
                target="_blank"
              >
                <img
                  src="../images/luminous-spiral.jpg"
                  alt="作品1のサムネイル"
                />
                <h3 class="work-title">冨樫紀子ポートフォリオサイト</h3>
                <p class="work-description">
                  ブランドカラーと余白を活かした、静かで広がりのある構成。
                </p>
              </a>
              <div class="repo-link">
                <a
                  href="https://github.com/norikot622622-hub/noriko.t-portfolio"
                  target="_blank"
                >
                  GitHub リポジトリを見る
                </a>
              </div>
            </div>
          </div>

          <!-- 作品カード2（アロマサイト） -->
          <div class="work-item">
            <div class="work-card">
              <a
                href="https://norikot622622-hub.github.io/aroma-instructor-site/"
                target="_blank"
              >
                <img
                  src="../images/work2.jpg"
                  alt="作品2のサムネイル"
                />
                <h3 class="work-title">
                  架空のアロマテラピーインストラクター紹介サイト
                </h3>
                <p class="work-description">
                  やさしさと信頼感をテーマにした、自然光を活かしたデザイン。
                </p>
              </a>
              <div class="repo-link">
                <a
                  href="https://github.com/norikot622622-hub/aroma-instructor-site"
                  target="_blank"
                >
                  GitHub リポジトリを見る
                </a>
              </div>
            </div>
          </div>

        </div>
      </div>
    </section>
  </body>
