<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Certifications</title>

    <link rel="stylesheet" href="../style-new.css" />
    <link rel="icon" href="../favicon.png" type="image/png" />
  </head>

  <body>
    <!-- Hero Section -->
    <section class="certifications-hero">
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <h1 class="hero-name">Certifications</h1>
        <p class="hero-title">Noriko Togashi - Web Creator</p>
      </div>
    </section>

    <!-- Certifications Section -->
    <section id="cert-list" class="cert-list-section">
      <div class="intro-inner">
        <h2 class="intro-heading">取得資格・認定</h2>

        <div class="cert-grid">
          <!-- カード1 -->
          <div class="cert-card">
            <h3 class="cert-title">HTML5プロフェッショナル認定試験</h3>
            <p class="cert-description">
              Web標準やマークアップ、フロントエンド基礎を体系的に身につけるため、現在学習を進めています。
            </p>
          </div>

          <!-- カード2 -->
          <div class="cert-card">
            <h3 class="cert-title">ITパスポート</h3>
            <p class="cert-description">
              IT基礎知識・情報セキュリティ・業務理解の習得に向けて現在勉強中です。
            </p>
          </div>

          <!-- カード3（必要に応じて追加） -->
          <div class="cert-card">
            <h3 class="cert-title">Webクリエイター能力認定試験</h3>
            <p class="cert-description">
              HTML・CSSの正しい構造理解と制作スキルの習得に向けて、現在準備を進めています。
            </p>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
